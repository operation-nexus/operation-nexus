# Config for harness_queue.py (NX-381, Q-OPS-14). Paths expand "~".

# GitHub repo whose issues are the queue ("owner/name"). gh must be logged in with access to it.
repo: operation-nexus/operation-nexus
# Only issues opened by these logins are run; anyone else is ignored without a comment.
trusted_authors:
  - project-hiveplex  # the machine account agents and routines act as (Q-OPS-15)
  - SaltySeraphCodes
# Label names. A requester adds `run`; the queue swaps it for `running`, then `done` or `failed`.
labels:
  run: harness-run
  running: harness-running
  done: harness-done
  failed: harness-failed
# Upper bounds for a request's `seeds`, `hours` (game hours per run) and `workers`. `max_workers` is
# also the one worker budget all jobs running at once share (NX-442).
max_seeds: 50
max_hours: 72
max_workers: 12
# The budget is max_workers slot files in <work_dir>/slots (NX-460). A running job demands
# min(its workers, its runs left) of it. A job whose sha's balance.py has --slot-dir ("elastic")
# starts once 1 of the budget is undemanded, with the workers it asked for, and its workers take
# slots run by run, so it widens as older jobs' tails free slots. This key applies to older shas
# only: while a job runs, the next such job starts once this many budget workers are free (at
# least 1) and keeps that count for its whole run. 6: half the budget, a 12-run job in two waves.
min_overlap_workers: 6
# Most `set:` balance overrides (key=value pairs) in one request.
max_overrides: 16
# Most distinct profiles in one request (the number in profiles.yaml).
max_profiles: 6
# A uv sync or balance.py step running longer than this is killed and the job marked failed.
job_timeout_hours: 96
# Parallel processes when a request leaves `workers` out.
workers: 2
# Throwaway git worktrees and the lock file live here.
work_dir: ~/.local/share/nexus-harness/work
# One <issue>-<sha8>/ report directory and <issue>-<sha8>.log per job.
results_dir: ~/.local/share/nexus-harness/results
