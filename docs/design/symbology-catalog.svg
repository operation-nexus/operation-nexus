<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#070b10; font-family:'JetBrains Mono', monospace;">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Magenta Glitch Glow Filter -->
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Amber Logistics Glow Filter -->
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Metadata -->
  <text x="40" y="50" fill="#00e5ff" font-size="22" font-weight="bold" letter-spacing="2">HIVEPLEX / OPERATION NEXUS — TACTICAL SYMBOLOGY CATALOG</text>
  <text x="40" y="76" fill="#6f8ca8" font-size="12">EXTERNAL DESIGN ASSET DRAFT • RESOLUTION-AGNOSTIC VECTOR ASSETS • DUAL-ENCODED FRIEND/FOE</text>

  <!-- Section 1: Coalition Units (Quorum) -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="540" height="280" fill="#0c1420" stroke="#1d2e44" rx="6" />
    <text x="20" y="32" fill="#00e5ff" font-size="14" font-weight="bold">COALITION (THE QUORUM) — ANGULAR / CLEAN VECTORS</text>

    <!-- 1. Strike Fighter -->
    <g transform="translate(60, 90)">
      <path d="M 0,-24 L 20,16 L 8,10 L 0,16 L -8,10 L -20,16 Z" fill="#00e5ff" stroke="#ffffff" stroke-width="2" filter="url(#glow-cyan)" />
      <!-- Afterburner burn -->
      <line x1="0" y1="16" x2="0" y2="28" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">STRIKE FIGHTER</text>
      <text x="0" y="66" fill="#6f8ca8" font-size="9" text-anchor="middle">(!join strike)</text>
    </g>

    <!-- 2. Recon UAV -->
    <g transform="translate(190, 90)">
      <polygon points="0,-20 18,0 0,20 -18,0" fill="#00e5ff" stroke="#ffffff" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="5" fill="#070b10" stroke="#00e5ff" stroke-width="2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">RECON UAV</text>
      <text x="0" y="66" fill="#6f8ca8" font-size="9" text-anchor="middle">(!join recon)</text>
    </g>

    <!-- 3. Logistics Truck -->
    <g transform="translate(320, 90)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#ffaa00" stroke="#ffffff" stroke-width="2" filter="url(#glow-amber)" />
      <rect x="-6" y="-6" width="12" height="12" fill="#070b10" stroke="#ffaa00" stroke-width="1.5" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">LOGISTICS TRUCK</text>
      <text x="0" y="66" fill="#ffaa00" font-size="9" text-anchor="middle">(!join logi)</text>
    </g>

    <!-- 4. Garrison Infantry -->
    <g transform="translate(450, 90)">
      <rect x="-14" y="-14" width="28" height="28" fill="#00e5ff" stroke="#ffffff" stroke-width="2" filter="url(#glow-cyan)" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#070b10" stroke-width="2" />
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="#070b10" stroke-width="2" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">GARRISON INF</text>
      <text x="0" y="66" fill="#6f8ca8" font-size="9" text-anchor="middle">Defense / Hold</text>
    </g>

    <!-- Coalition Facilities -->
    <g transform="translate(60, 200)">
      <!-- Airbase -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00e5ff" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#00e5ff" />
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="32" fill="#e0e6ed" font-size="10" text-anchor="middle">AIRBASE</text>
    </g>

    <g transform="translate(190, 200)">
      <!-- Forward Operating Base (FOB) -->
      <polygon points="0,-14 14,-14 14,14 0,14 -14,14 -14,-14" fill="#070b10" stroke="#00e5ff" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#00e5ff" />
      <text x="0" y="32" fill="#e0e6ed" font-size="10" text-anchor="middle">FORWARD FOB</text>
    </g>

    <g transform="translate(320, 200)">
      <!-- Radar Installation -->
      <path d="M -16,10 A 18,18 0 0,1 16,10" fill="none" stroke="#00e5ff" stroke-width="3" />
      <path d="M -10,14 A 12,12 0 0,1 10,14" fill="none" stroke="#00e5ff" stroke-width="2" />
      <circle cx="0" cy="14" r="3" fill="#ffffff" />
      <text x="0" y="32" fill="#e0e6ed" font-size="10" text-anchor="middle">EARLY RADAR</text>
    </g>

    <g transform="translate(450, 200)">
      <!-- SAM Battery -->
      <polygon points="0,-16 14,12 -14,12" fill="#070b10" stroke="#00e5ff" stroke-width="2" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#00e5ff" stroke-width="3" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="2 2" />
      <text x="0" y="32" fill="#e0e6ed" font-size="10" text-anchor="middle">SAM BATTERY</text>
    </g>
  </g>

  <!-- Section 2: The Static (Enemy) -->
  <g transform="translate(620, 110)">
    <rect x="0" y="0" width="540" height="280" fill="#180b12" stroke="#441a27" rx="6" />
    <text x="20" y="32" fill="#ff0055" font-size="14" font-weight="bold">THE STATIC (ENEMY) — JAGGED / GLITCH SHARDS</text>

    <!-- 1. Static Fighter -->
    <g transform="translate(60, 90)">
      <path d="M 0,-24 L 16,8 L 10,16 L 2,8 L -2,16 L -10,8 L -16,8 Z" fill="#ff0055" stroke="#ffffff" stroke-width="2" filter="url(#glow-magenta)" />
      <!-- Glitch trails -->
      <line x1="4" y1="18" x2="4" y2="28" stroke="#ff00aa" stroke-width="2" />
      <line x1="-4" y1="18" x2="-4" y2="24" stroke="#ff0055" stroke-width="2" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">STATIC FIGHTER</text>
      <text x="0" y="66" fill="#ff0055" font-size="9" text-anchor="middle">[BANDIT AI]</text>
    </g>

    <!-- 2. Static Recon Swarm -->
    <g transform="translate(190, 90)">
      <polygon points="0,-18 14,-4 6,14 -12,8" fill="#ff0055" stroke="#ffffff" stroke-width="2" filter="url(#glow-magenta)" />
      <!-- Fractured satellite shards -->
      <polygon points="16,-12 22,-6 18,2" fill="#ff00aa" />
      <polygon points="-16,10 -22,14 -18,6" fill="#ff00aa" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">RECON SWARM</text>
      <text x="0" y="66" fill="#ff0055" font-size="9" text-anchor="middle">[ASYNCHRONOUS]</text>
    </g>

    <!-- 3. Armored Spearhead -->
    <g transform="translate(320, 90)">
      <polygon points="-16,-12 16,-12 20,12 -20,12" fill="#ff0055" stroke="#ffffff" stroke-width="2" filter="url(#glow-magenta)" />
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#ffffff" stroke-width="3" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">ARMORED SPEARHEAD</text>
      <text x="0" y="66" fill="#ff0055" font-size="9" text-anchor="middle">Breakthrough Unit</text>
    </g>

    <!-- 4. Static Interceptor SAM -->
    <g transform="translate(450, 90)">
      <polygon points="0,-18 16,12 -16,12" fill="#300512" stroke="#ff0055" stroke-width="2" />
      <polygon points="0,-10 6,6 -6,6" fill="#ff00aa" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="4 2" />
      <text x="0" y="50" fill="#e0e6ed" font-size="11" text-anchor="middle">IADS SAM SITE</text>
      <text x="0" y="66" fill="#ff0055" font-size="9" text-anchor="middle">Lethal Intercept</text>
    </g>

    <!-- Static Mastermind NULL Transmission Emblem -->
    <g transform="translate(270, 205)">
      <rect x="-220" y="-35" width="440" height="70" fill="#200510" stroke="#ff0055" stroke-width="1.5" rx="4" />
      <text x="-200" y="-12" fill="#ff00aa" font-size="11" font-weight="bold" letter-spacing="1.5">[MASTERMIND FREQUENCY // NULL]</text>
      <text x="-200" y="10" fill="#ffffff" font-size="10">"EVERY SIGNAL IS AN INVITATION. WE HEAR YOUR CHAT."</text>
      <!-- Skull/Signal waveform glyph -->
      <path d="M 160,-15 L 180,-15 L 190,5 L 170,15 L 150,5 Z" fill="#ff0055" filter="url(#glow-magenta)" />
      <circle cx="165" cy="-2" r="2.5" fill="#070b10" />
      <circle cx="175" cy="-2" r="2.5" fill="#070b10" />
    </g>
  </g>

  <!-- Section 3: Telemetry, Supply & Tactical Annotations -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="1120" height="340" fill="#090e15" stroke="#1c2d42" rx="6" />
    <text x="20" y="32" fill="#00e5ff" font-size="14" font-weight="bold">BROADCAST TELEMETRY, HUD TIERS & ANNOTATION LAYER</text>

    <!-- Momentum Bar Concept -->
    <g transform="translate(40, 60)">
      <text x="0" y="14" fill="#8da4be" font-size="11" font-weight="bold">SIGNAL MOMENTUM BAR (OV-1 / OV-12 ALWAYS ON):</text>
      <rect x="0" y="24" width="460" height="24" fill="#05090f" stroke="#22364c" rx="3" />
      <rect x="2" y="26" width="280" height="20" fill="url(#cyan-grad)" filter="url(#glow-cyan)" />
      <rect x="282" y="26" width="176" height="20" fill="#ff0055" opacity="0.8" />
      <line x1="282" y1="22" x2="282" y2="50" stroke="#ffffff" stroke-width="2" />
      <text x="140" y="40" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">QUORUM: 64%</text>
      <text x="370" y="40" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">STATIC: 36%</text>
    </g>

    <!-- Threat Tier Badges -->
    <g transform="translate(560, 60)">
      <text x="0" y="14" fill="#8da4be" font-size="11" font-weight="bold">THREAT CONDITION TIERS (Q-TD-1):</text>
      <!-- Green POL -->
      <rect x="0" y="24" width="150" height="28" fill="#112519" stroke="#337755" rx="3" />
      <text x="75" y="42" fill="#55bb88" font-size="10" font-weight="bold" text-anchor="middle">PATTERN OF LIFE</text>

      <!-- Amber Alpha -->
      <rect x="170" y="24" width="150" height="28" fill="#2d2208" stroke="#aa7700" rx="3" />
      <text x="245" y="42" fill="#ffaa00" font-size="10" font-weight="bold" text-anchor="middle">CONDITION ALPHA</text>

      <!-- Red Bravo -->
      <rect x="340" y="24" width="150" height="28" fill="#380816" stroke="#ff0055" rx="3" filter="url(#glow-magenta)" />
      <text x="415" y="42" fill="#ff0055" font-size="10" font-weight="bold" text-anchor="middle">CONDITION BRAVO</text>
    </g>

    <!-- Ephemeral Annotations & Combat Arrows -->
    <g transform="translate(40, 160)">
      <text x="0" y="0" fill="#8da4be" font-size="11" font-weight="bold">EPHEMERAL MAP ANNOTATIONS (AN-1..AN-5):</text>

      <!-- Advance Arrow -->
      <g transform="translate(40, 40)">
        <path d="M 0,0 L 120,0 M 100,-10 L 120,0 L 100,10" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="6 3" />
        <text x="60" y="-10" fill="#00e5ff" font-size="10" text-anchor="middle">AXIS OF ADVANCE</text>
      </g>

      <!-- Rally Pin -->
      <g transform="translate(240, 40)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="3 2" />
        <circle cx="0" cy="0" r="4" fill="#ffaa00" />
        <text x="0" y="24" fill="#ffaa00" font-size="10" text-anchor="middle">!rally (DEFEND)</text>
      </g>

      <!-- Engagement Burst / SAM Intercept -->
      <g transform="translate(380, 40)">
        <circle cx="0" cy="0" r="20" fill="none" stroke="#ff0055" stroke-width="1.5" />
        <line x1="-15" y1="-15" x2="15" y2="15" stroke="#ff0055" stroke-width="2" />
        <line x1="15" y1="-15" x2="-15" y2="15" stroke="#ff0055" stroke-width="2" />
        <text x="0" y="28" fill="#ff0055" font-size="10" text-anchor="middle">Pk 88% INTERCEPT</text>
      </g>

      <!-- User Spotlight (!me) -->
      <g transform="translate(540, 40)">
        <polygon points="0,-16 12,10 -12,10" fill="#00e5ff" stroke="#ffffff" stroke-width="2" />
        <rect x="-40" y="-36" width="80" height="16" fill="#002b3d" stroke="#00e5ff" rx="2" />
        <text x="0" y="-24" fill="#ffffff" font-size="9" text-anchor="middle" font-weight="bold">@You [VIPER-04]</text>
        <circle cx="0" cy="0" r="26" fill="none" stroke="#00e5ff" stroke-width="1" />
      </g>

      <!-- Supply Artery Pulse -->
      <g transform="translate(740, 40)">
        <path d="M 0,0 Q 60,-30 120,0 T 240,0" fill="none" stroke="#ffaa00" stroke-width="4" stroke-linecap="round" filter="url(#glow-amber)" />
        <circle cx="80" cy="-12" r="5" fill="#ffffff" />
        <text x="120" y="22" fill="#ffaa00" font-size="10" text-anchor="middle">SUPPLY ARTERY FLOW (Q-UX-6)</text>
      </g>
    </g>

    <!-- Bottom Readability Note -->
    <text x="40" y="300" fill="#6f8ca8" font-size="11">
      NOTE: All symbology utilizes shape-coding + locked high-contrast palette verified for protanopia, deuteranopia, and tritanopia.
    </text>
  </g>
</svg>
