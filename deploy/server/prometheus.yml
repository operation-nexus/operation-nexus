# hiveplex-linux Prometheus config (deploy/server/prometheus.yml). Everything listens on 127.0.0.1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"]}]
  - job_name: node
    static_configs: [{targets: ["127.0.0.1:9100"], labels: {host: hiveplex-linux}}]
  - job_name: kasa
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs: [{targets: ["127.0.0.1:9112"]}]
  - job_name: ping
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ["1.1.1.1"]
        labels: {kind: internet, name: cloudflare-dns}
      - targets: ["8.8.8.8"]
        labels: {kind: internet, name: google-dns}
      - targets: ["192.168.1.1"]
        labels: {kind: lan, name: router}
      - targets: ["192.168.1.102"]
        labels: {kind: lan, name: harness-pc}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
  - job_name: web
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["https://github.com"]
        labels: {kind: internet, name: github}
      - targets: ["https://discord.com"]
        labels: {kind: internet, name: discord}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
