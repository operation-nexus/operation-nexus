# Grafana for hiveplex-linux. Runs on the host network, listening on all addresses; ufw allows port 3000 only on tailscale0 and loopback (no LAN rule).
# The admin password is in /etc/hiveplex-grafana.env (root-only, not in git). Prometheus listens on 127.0.0.1:9090.
services:
  grafana:
    image: grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: hiveplex-grafana
    restart: unless-stopped
    network_mode: host
    env_file: /etc/hiveplex-grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only anonymous Viewer for the kiosk screen. Only loopback and the tailnet can reach port 3000 (ufw);
      # editing and the admin pages still need the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/hiveplex.json
    volumes:
      - /var/lib/hiveplex-grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana-dashboards:ro
