# Grafana for hiveplex-linux. Runs on the host network, bound to the Tailscale address only (tailnet access, not the LAN).
# The admin password is in /etc/hiveplex-grafana.env (root-only, not in git). Prometheus listens on 127.0.0.1:9090.
services:
  grafana:
    image: grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: hiveplex-grafana
    restart: unless-stopped
    network_mode: host
    env_file: /etc/hiveplex-grafana.env
    environment:
      GF_SERVER_HTTP_ADDR: 100.113.223.88
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/hiveplex.json
    volumes:
      - /var/lib/hiveplex-grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana-dashboards:ro
